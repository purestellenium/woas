<!doctype html>
<html>
  <!-- this is the sample html file, what we're aiming for the compile script to create. i'm gonna build out the basic workings of the engine in this file first, and then get it to a place where the python script can generate it -->
  <head>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
      }

      body {
        background-color: black;
        display: grid;
        place-items: center;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      .canvas {
        padding-left: 2cqw;
        padding-right: 2cqw;
        box-sizing: border-box;
        background-color: white;
        aspect-ratio: 4 / 3;
        width: min(100vw, 177.78vh);
        height: min(100vh, 56.25vw);
        display: flex;
      }

      p {
        font-family: Georgia;
      }

      /* text sizes */

      .s {
        font-size: 3cqw;
      }

      .m {
        font-size: 4cqw;
      }

      .l {
        font-size: 6cqw;
      }

      .xl {
        font-size: 10cqw;
      }

      .xxl {
        font-size: 18cqw;
      }

      /* positioning */

      .center {
        margin-left: auto;
        margin-right: auto;
      }

      .left {
        margin-right: auto;
      }

      .right {
        margin-left: auto;
      }

      .vcenter {
        align-self: center;
      }

      .top {
        align-self: flex-start;
      }

      .bottom {
        align-self: flex-end;
      }

      .centeralign {
        text-align: center;
      }

      .rightalign {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <p class="l centeralign vcenter">
        warm sunlight floods through your window, hitting your face and breaking
        your slumber.
      </p>
    </div>
  </body>
</html>
