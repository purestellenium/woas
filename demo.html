<!doctype html>
<html>
    <head>
        <title>yuri</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Copse&amp;display=swap">
        <style>
            * {
            user-select: none;
            }

            body,
            html {
                margin: 0;
                padding: 0;
            }

            body {
                background-color: black;
                display: grid;
                place-items: center;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
            }

            #canvas {
                box-sizing: border-box;
                background-color: white;
                aspect-ratio: 4 / 3;
                width: min(100vw, 177.78vh);
                height: min(100vh, 56.25vw);
                display: flex;
                container-type: inline-size;
                flex-direction: column;
            }

            .choice {
                display: flex;
                justify-content: center;
                gap: 7.5cqw;
                flex-wrap: wrap;
            }

            .choice p {
                cursor: pointer;
            }

            .choice-container {
                display: flex;
                flex-direction: column;
                margin-top: auto;
                margin-bottom: auto;
            }

            p,
            a {
                font-family: Georgia;
                margin: 2cqw;
                font-size: 3cqw;
            }

            .s {
                font-size: 3cqw;
            }

            .m {
                font-size: 4cqw;
            }

            .l {
                font-size: 6cqw;
            }

            .xl {
                font-size: 10cqw;
            }

            .xxl {
                font-size: 18cqw;
            }

            .vcenter {
                margin-top: auto;
                margin-bottom: auto;
            }

            .bottom {
                margin-top: auto;
            }

            .center {
                align-self: center;
            }

            .left {
                align-self: flex-start;
            }

            .right {
                align-self: flex-end;
            }

            .centeralign {
                text-align: center;
            }

            .rightalign {
                text-align: right;
            }
        </style>
    </head>
    <body>
        <div id="canvas"></div>
        <script>
            const canvas = document.getElementById("canvas");
            let queue = 
        [["font", "Copse"], ["bg", "#001236"], ["color", "#fcffbd"], ["text", "press space to start", "l center vcenter centeralign", "white", "monospace", false], ["music", "play", "https://opengameart.org/sites/default/files/amb_rain2_0.mp3"], ["text", "It's almost closing at the coffee shop you work at, which means the few patrons you have left are the timid and quiet type.", "m centeralign vcenter", null, null, false], ["text", "All you can hear is the quiet but steady pitter-patter of the rain hitting the awning in front of the shop.", "m vcenter centeralign", null, null, false], ["text", "Suddenly, the bell above the door rings with vigor, and the rain gets louder as the door opens.", "m vcenter centeralign", null, null, false], ["music", "play", "https://opengameart.org/sites/default/files/under_the_rain_-_migfus20.mp3"], ["text", "...a girl rushes through the door, soaking wet.", "", null, null, false], ["text", "She stops, just in front of the doorway, with her hands on her knees, trying to catch her breath.", "", null, null, true], ["text", "Finally recovering, she looks up at you, and you see her face.", "", null, null, true], ["text", "It's your crush.", "xl center vcenter centeralign", "#f5a9b8", null, true], ["text", "\"Hey there, barista girl!\" she says, smiling at you.", "", "#f5a9b8", null, false], ["text", "Before you can even respond, she's already leaned over the counter, yapping on about how she got here.", "", null, null, true], ["text", "It's part of what you like about her. She talks more, so you don't have to.", "", null, null, true], ["text", "\"Say, I'm... actually a little cold from the rain. Don't suppose you've got anything for that?\"", "", "#f5a9b8", null, false], ["choice", "You smile. \"I've got just the thing.\"", [{"text": "Make her usual coffee", "jump": "coffee"}, {"text": "Give her your jacket", "jump": "jacket"}, {"text": "Walk her home", "jump": "walk"}], "#a58dca", null, true], ["jump", "coffee"], ["text", "\"Your usual order will warm you right up - let me make it for you!\"", "", "#a58dca", null, false], ["text", "\"Oh, my <i>usual</i> order?\" She lets out a little giggle. \"You know me so well.\"", "", "#f5a9b8", null, true], ["end", "coffee"], ["jump", "jacket"], ["end", "jacket"], ["jump", "walk"], ["end", "walk"]];

            let choiceActive = false;
            let currentFont = "Georgia";
            let currentColor = "black";
            let music = new Audio();

            function doFirstQueue() {
                let firstqueue = queue[0];

                if (!firstqueue) {
                    return;
                }

                if (firstqueue[0] == "text") {
                    const text = document.createElement("p");

                    text.innerHTML = firstqueue[1];
                    text.className = firstqueue[2];
                    text.style.color = firstqueue[3] ?? currentColor;
                    text.style.fontFamily = firstqueue[4] ?? currentFont;

                    if (firstqueue[5]) {
                        canvas.appendChild(text);
                    } else {
                        canvas.replaceChildren(text);
                    }

                    return;
                } else if (firstqueue[0] == "bg") {
                    canvas.style.background = firstqueue[1];
                    canvas.style.backgroundSize = "cover";
                    canvas.style.backgroundPosition = "center";
                    queue.shift();
                    doFirstQueue();
                    return;
                } else if (firstqueue[0] == "music") {
                    if (firstqueue[1] == "play") {
                        if (firstqueue[2]) {
                            music.pause();
                            music = new Audio(firstqueue[2]);
                        }
                        music.loop = true;
                        music.play();
                    } else if (firstqueue[1] == "stop") {
                        music.pause();
                        music.currentTime = 0;
                    } else if (firstqueue[1] == "pause") {
                        music.pause();
                    }
                    queue.shift();
                    doFirstQueue();
                    return;
                } else if (firstqueue[0] == "choice") {
                    choiceActive = true;
                    let promptText = firstqueue[1];
                    let optionsArray = firstqueue[2];
                    let textColor = firstqueue[3] ?? currentColor;
                    let textFont = firstqueue[4] ?? currentFont;

                    let container = document.createElement("div");
                    container.className = "choice-container";

                    let promptParagraph = document.createElement("p");
                    promptParagraph.className = "l center";
                    promptParagraph.innerText = promptText;
                    promptParagraph.style.color = textColor;
                    promptParagraph.style.fontFamily = textFont;
                    container.appendChild(promptParagraph);

                    let choiceDiv = document.createElement("div");
                    choiceDiv.className = "choice";

                    optionsArray.forEach((option) => {
                        let optionButton = document.createElement("p");
                        optionButton.className = "m";
                        optionButton.innerText = option.text;
                        optionButton.style.color = textColor;
                        optionButton.style.fontFamily = textFont;

                        optionButton.addEventListener("click", function (e) {
                            e.stopPropagation();

                            while (
                                queue.length > 0 &&
                                !(
                                    queue[0][0] === "jump" &&
                                    queue[0][1] === option.jump
                                )
                            ) {
                                queue.shift();
                            }

                            if (queue.length > 0) {
                                queue.shift();
                            }

                            choiceActive = false;
                            doFirstQueue();
                        });

                        choiceDiv.appendChild(optionButton);
                    });

                    container.appendChild(choiceDiv);

                    if (firstqueue[5]) {
                        canvas.appendChild(container);
                    } else {
                        canvas.replaceChildren(container);
                    }

                    return;
                } else if (firstqueue[0] == "jump") {
                    while (
                        queue.length > 0 &&
                        !(
                            queue[0][0] === "end" &&
                            queue[0][1] === firstqueue[1]
                        )
                    ) {
                        queue.shift();
                    }

                    if (queue.length > 0) {
                        queue.shift();
                        doFirstQueue();
                    }

                    return;
                } else if (firstqueue[0] == "skip") {
                    while (
                        queue.length > 0 &&
                        !(
                            queue[0][0] === "jump" &&
                            queue[0][1] === firstqueue[1]
                        )
                    ) {
                        queue.shift();
                    }

                    if (queue.length > 0) {
                        queue.shift();
                        doFirstQueue();
                    }

                    return;
                } else if (firstqueue[0] == "font") {
                    currentFont = firstqueue[1];
                    queue.shift();
                    doFirstQueue();
                    return;
                } else if (firstqueue[0] == "import") {
                    const fontFace = new FontFace(
                        firstqueue[1],
                        `url("${firstqueue[2]}")`,
                    );

                    fontFace
                        .load()
                        .then((loadedFace) => {
                            document.fonts.add(loadedFace);
                        })
                        .catch((err) => {
                            console.error(
                                `Failed to load font "${firstqueue[1]}":`,
                                err,
                            );
                        })
                        .finally(() => {
                            queue.shift();
                            doFirstQueue();
                        });
                    return;
                } else if (firstqueue[0] == "color") {
                    currentColor = firstqueue[1];
                    queue.shift();
                    doFirstQueue();
                    return;
                } else {
                    queue.shift();
                    doFirstQueue();
                    return;
                }
            }

            doFirstQueue();

            document.addEventListener("keydown", (event) => {
                if (event.repeat) return;

                if (event.code === "Space" && !choiceActive) {
                    queue.shift();
                    doFirstQueue();
                }
            });

            canvas.addEventListener("click", () => {
                if (!choiceActive) {
                    queue.shift();
                    doFirstQueue();
                }
            });
        </script>
    </body>
</html>
