        <style>
            * {

            body,

                height: 100vh;
                overflow: hidden;
            }

                height: min(100vh, 56.25vw);

                flex-direction: column;

            .choice {

            .choice p {

            .choice-container {

            }

                font-size: 4cqw;
            }

            .l {
                font-size: 6cqw;
            }

            .xl {
                font-size: 10cqw;
            }

            .xxl {
                font-size: 18cqw;
            }

            .vcenter {
                margin-top: auto;
                margin-bottom: auto;
            }

            .bottom {
                margin-top: auto;
            }

            .center {
                align-self: center;
            }

            .left {
                align-self: flex-start;
            }

            .right {
                align-self: flex-end;
            }

            .centeralign {
                text-align: center;
            }

            .rightalign {
                text-align: right;
            }
        </style>
    </head>
    <body>
        <div id="canvas"></div>
        <script>
            const canvas = document.getElementById("canvas");

nd your waist and pulls you close.", "", null, null, true], ["text", "The rain is freezing, but walking next to her, you've never felt warmer.", "", null, null, true], ["skip", "home"], ["end", "cwalker"], ["jump", "home"], ["text", "Eventually, the two of you arrive at the front steps of her apartment building.", "", null, null, false], ["text", "The porch awning shields you from the downpour, allowing you to finally close the umbrella.", "", null, null, true], ["text", "She lingers in the doorway for a moment, keys in hand, looking back up at you with a soft expression.", "", null, null, true], ["text", "\"Thank you for making sure I got back safe,\" she smiles.", "", "#a58dca", null, false], ["text", "She steps inside, but before the heavy door clicks shut, she peeks her head back out.", "", null, null, true], ["text", "\"Goodnight, my barista girl.\"", "", "#a58dca", null, true], ["text", "You stand there dazed for a second, and when you snap back to reality, she's already gone inside.", "", null, null, true], ["end", "home"], ["text", "\"My barista girl.\" That's what she called you. ...it has a nice ring to it.", "m center vcenter centeralign", null, null, false], ["text", "You get your things in order, and head home. You can't wait to see her tomorrow.", "", null, null, false], ["text", "Fin.", "xl center vcenter", "white", null, false]];

            let choiceActive = false;
            let currentFont = "Georgia";
            let currentColor = "black";
            let music = new Audio();
            music.volume = 0.5;

            function doFirstQueue() {
                let firstqueue = queue[0];

                if (!firstqueue) {
                    return;
                }

                if (firstqueue[0] == "text") {
                    const text = document.createElement("p");

                    text.innerHTML = firstqueue[1];
                    text.className = firstqueue[2];
                    text.style.color = firstqueue[3] ?? currentColor;
                    text.style.fontFamily = firstqueue[4] ?? currentFont;

                    if (firstqueue[5]) {
                        canvas.appendChild(text);
                    } else {
                        canvas.replaceChildren(text);
                    }

                    return;
                } else if (firstqueue[0] == "bg") {
                    canvas.style.background = firstqueue[1];
                    canvas.style.backgroundSize = "cover";
                    canvas.style.backgroundPosition = "center";
                    queue.shift();
                    doFirstQueue();
                    return;
                } else if (firstqueue[0] == "music") {
                    if (firstqueue[1] == "play") {
                        if (firstqueue[2]) {
                            music.pause();
                            music = new Audio(firstqueue[2]);
                            music.volume = 0.5;
                        }
                        music.loop = true;
                        music.play();
                    } else if (firstqueue[1] == "stop") {
                        music.pause();
                        music.currentTime = 0;
                    } else if (firstqueue[1] == "pause") {
                        music.pause();
                    }
                    queue.shift();
                    doFirstQueue();
                    return;
                } else if (firstqueue[0] == "choice") {
                    choiceActive = true;
                    let promptText = firstqueue[1];
                    let optionsArray = firstqueue[2];
                    let textColor = firstqueue[3] ?? currentColor;
                    let textFont = firstqueue[4] ?? currentFont;

                    let container = document.createElement("div");
                    container.className = "choice-container";

                    let promptParagraph = document.createElement("p");
                    promptParagraph.className = "l center";
                    promptParagraph.innerText = promptText;
                    promptParagraph.style.color = textColor;
                    promptParagraph.style.fontFamily = textFont;
                    container.appendChild(promptParagraph);

                    let choiceDiv = document.createElement("div");
                    choiceDiv.className = "choice";

                    optionsArray.forEach((option) => {
                        let optionButton = document.createElement("p");
                        optionButton.className = "m";
                        optionButton.innerText = option.text;
                        optionButton.style.color = textColor;
                        optionButton.style.fontFamily = textFont;

                        optionButton.addEventListener("click", function (e) {
                            e.stopPropagation();

                            while (
                                queue.length > 0 &&
                                !(
                                    queue[0][0] === "jump" &&
                                    queue[0][1] === option.jump
                                )
                            ) {

                            }

                            if (queue.length > 0) {
                                queue.shift();
                            }

                            choiceActive = false;

                        });

                        choiceDiv.appendChild(optionButton);
                    });

                    container.appendChild(choiceDiv);

                    if (firstqueue[5]) {
                        canvas.appendChild(container);
                    } else {
                        canvas.replaceChildren(container);
                    }

                    return;
                } else if (firstqueue[0] == "jump") {
                    while (
                        queue.length > 0 &&
                        !(
                            queue[0][0] === "end" &&
                            queue[0][1] === firstqueue[1]
                        )
                    ) {
                        queue.shift();
                    }

                    if (queue.length > 0) {
                        queue.shift();
                        doFirstQueue();
                    }

                    return;
                } else if (firstqueue[0] == "skip") {
                    while (
                        queue.length > 0 &&
                        !(
                            queue[0][0] === "jump" &&
                            queue[0][1] === firstqueue[1]
                        )
                    ) {
                        queue.shift();
                    }

                    if (queue.length > 0) {
                        queue.shift();
                        doFirstQueue();
                    }

                    return;
                } else if (firstqueue[0] == "font") {
                    currentFont = firstqueue[1];
                    queue.shift();
                    doFirstQueue();
                    return;
                } else if (firstqueue[0] == "import") {
                    const fontFace = new FontFace(
                        firstqueue[1],
                        `url("${firstqueue[2]}")`,
                    );

                    fontFace
                        .load()
                        .then((loadedFace) => {
                            document.fonts.add(loadedFace);
                        })
                        .catch((err) => {
                            console.error(
                                `Failed to load font "${firstqueue[1]}":`,
                                err,
                            );
                        })
                        .finally(() => {
                            queue.shift();
                            doFirstQueue();
                        });
                    return;
                } else if (firstqueue[0] == "color") {
                    currentColor = firstqueue[1];
                    queue.shift();
                    doFirstQueue();
                    return;
                } else {
                    queue.shift();
                    doFirstQueue();
                    return;
                }
            }

            doFirstQueue();

            document.addEventListener("keydown", (event) => {
                if (event.repeat) return;

                if (event.code === "Space" && !choiceActive) {
                    queue.shift();
                    doFirstQueue();
                }
            });

            canvas.addEventListener("click", () => {
                if (!choiceActive) {
                    queue.shift();
                    doFirstQueue();
                }
            });
        </script>
