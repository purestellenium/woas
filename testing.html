<!doctype html>
<html>
    <head>
        <title>My test game</title>
        <style>
            body,
            html {
                margin: 0;
                padding: 0;
            }

            body {
                background-color: black;
                display: grid;
                place-items: center;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
            }

            #canvas {
                box-sizing: border-box;
                background-color: white;
                aspect-ratio: 4 / 3;
                width: min(100vw, 177.78vh);
                height: min(100vh, 56.25vw);
                display: flex;
                container-type: inline-size;
                flex-direction: column;
            }

            .choice {
                display: flex;
                justify-content: center;
                gap: 7.5cqw;
            }

            .choice p {
                cursor: pointer;
            }

            .choice-container {
                display: flex;
                flex-direction: column;
                margin-top: auto;
                margin-bottom: auto;
            }

            p,
            a {
                font-family: Georgia;
                margin: 2cqw;
            }

            /* text sizes */

            .s {
                font-size: 3cqw;
            }

            .m {
                font-size: 4cqw;
            }

            .l {
                font-size: 6cqw;
            }

            .xl {
                font-size: 10cqw;
            }

            .xxl {
                font-size: 18cqw;
            }

            /* positioning */

            .vcenter {
                margin-top: auto;
                margin-bottom: auto;
            }

            .bottom {
                margin-top: auto;
            }

            .center {
                align-self: center;
            }

            .left {
                align-self: flex-start;
            }

            .right {
                align-self: flex-end;
            }

            .centeralign {
                text-align: center;
            }

            .rightalign {
                text-align: right;
            }
        </style>
    </head>
    <body>
        <div id="canvas"></div>
        <script>
            const canvas = document.getElementById("canvas");
            let queue = 
        [["font", "Georgia"], ["color", "green"], ["text", "space to start", "xl center vcenter", "black", null], ["music", "play", "nyan_cat.mp3"], ["text", "welcome", "xl rightalign left", null, null], ["music", "stop"], ["text", "this is the first text", "l vcenter center centeralign", "#ff0000", "sans-serif"], ["bg", "gray"], ["text", "and the second text is this", "m right leftalign bottom", null, "monospace"], ["choice", "which vial to take?", [{"text": "estrogen", "jump": "estrogen"}, {"text": "furry elixir", "jump": "furry"}, {"text": "gay juice", "jump": "gay"}], "royalblue"], ["jump", "estrogen"], ["text", "estrogen chosen", "l center vcenter centeralign", null, null], ["text", "you girl now", "l center vcenter centeralign", null, null], ["end", "estrogen"], ["jump", "furry"], ["text", "furry elixir chosen", "l center vcenter centeralign", null, null], ["text", "you grow cat ears and a tail! ^w^", "l center vcenter centeralign", null, null], ["end", "furry"], ["jump", "gay"], ["text", "gay juice chosen", "l center vcenter centeralign", null, null], ["text", "you gay now", "l center vcenter centeralign", null, null], ["end", "gay"], ["text", "fin", "xl center vcenter", null, "monospace"]];

            let choiceActive = false;
            let currentFont = "Georgia";
            let currentColor = "black";
            let music = new Audio();

            function doFirstQueue() {
                let firstqueue = queue[0];

                if (!firstqueue) {
                    canvas.replaceChildren(); // clear canvas on game end, might remove later
                    return;
                }

                if (firstqueue[0] == "text") {
                    const text = document.createElement("p");

                    text.textContent = firstqueue[1];
                    text.className = firstqueue[2];
                    text.style.color = firstqueue[3] ?? currentColor;
                    text.style.fontFamily = firstqueue[4] ?? currentFont;
                    canvas.replaceChildren(text);
                    return;
                } else if (firstqueue[0] == "bg") {
                    canvas.style.background = firstqueue[1];
                    queue.shift();
                    doFirstQueue();
                    return;
                } else if (firstqueue[0] == "music") {
                    if (firstqueue[1] == "play") {
                        if (firstqueue[2]) {
                            music = new Audio(firstqueue[2]);
                        }
                        music.loop = true;
                        music.play();
                    } else if (firstqueue[1] == "stop") {
                        music.pause();
                        music.currentTime = 0;
                    } else if (firstqueue[1] == "pause") {
                        music.pause();
                    } else {
                    }
                    queue.shift();
                    doFirstQueue();
                    return;
                } else if (firstqueue[0] == "choice") {
                    choiceActive = true;
                    // create choice container

                    let promptText = firstqueue[1];
                    let optionsArray = firstqueue[2];
                    let textColor = firstqueue[3];

                    let container = document.createElement("div");
                    container.className = "choice-container";

                    let promptParagraph = document.createElement("p");
                    promptParagraph.className = "l center";
                    promptParagraph.innerText = promptText;
                    if (textColor) {
                        promptParagraph.style.color = textColor;
                    }
                    container.appendChild(promptParagraph);

                    let choiceDiv = document.createElement("div");
                    choiceDiv.className = "choice";

                    optionsArray.forEach((option) => {
                        let optionButton = document.createElement("p");
                        optionButton.className = "m";
                        optionButton.innerText = option.text;

                        if (textColor) {
                            optionButton.style.color = textColor;
                        }

                        optionButton.addEventListener("click", function (e) {
                            while (
                                queue.length > 0 &&
                                !(
                                    queue[0][0] === "jump" &&
                                    queue[0][1] === option.jump
                                )
                            ) {
                                queue.shift();
                            }

                            if (queue.length > 0) {
                                queue.shift();
                            }

                            choiceActive = false;
                            doFirstQueue();
                        });

                        choiceDiv.appendChild(optionButton);
                    });

                    container.appendChild(choiceDiv);
                    canvas.replaceChildren(container);
                    return;
                } else if (firstqueue[0] == "jump") {
                    while (
                        queue.length > 0 &&
                        !(
                            queue[0][0] === "end" &&
                            queue[0][1] === firstqueue[1]
                        )
                    ) {
                        queue.shift();
                    }

                    if (queue.length > 0) {
                        queue.shift();
                        doFirstQueue();
                    }

                    return;
                } else if (firstqueue[0] == "font") {
                    currentFont = firstqueue[1];
                    queue.shift();
                    doFirstQueue();
                    return;
                } else if (firstqueue[0] == "color") {
                    currentColor = firstqueue[1];
                    queue.shift();
                    doFirstQueue();
                    return;
                } else {
                    queue.shift();
                    doFirstQueue();
                    return;
                }
            }

            doFirstQueue();

            document.addEventListener("keydown", (event) => {
                if (event.repeat) return;

                if (event.code === "Space" && !choiceActive) {
                    queue.shift();
                    doFirstQueue();
                }
            });
        </script>
    </body>
</html>
